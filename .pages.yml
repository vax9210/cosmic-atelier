media:
  input: media
  output: /cosmic-atelier/media

content:
  - name: site
    label: 首頁文字設定
    type: file
    path: data/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: eyebrow
        label: 首頁小標題
        type: string
      - name: intro
        label: 首頁介紹
        type: text
      - name: library_intro
        label: 天文文獻區說明
        type: text
      - name: about_intro
        label: 關於本站說明
        type: text

  - name: sources
    label: 天文期刊與來源
    type: file
    path: data/sources.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: title
        label: 來源名稱
        type: string
        required: true
      - name: type
        label: 類別
        type: select
        options:
          values:
            - name: journal
              label: 學術期刊
            - name: preprint
              label: 預印本
            - name: news
              label: 天文通訊
      - name: label
        label: 英文標籤
        type: string
      - name: desc
        label: 來源介紹
        type: text
      - name: url
        label: 來源網址（https://）
        type: string

  - name: articles
    label: 天文文章管理
    type: collection
    path: src/content/articles
    format: yaml-frontmatter
    filename:
      template: "{fields.id}.md"
      field: false
    view:
      primary: title
      fields: [title, category, date, draft]
      sort: date
      order: desc
    fields:
      - name: id
        label: 文章唯一識別碼
        type: uuid
        hidden: true
        options:
          editable: false
      - name: title
        label: 文章標題
        type: string
        required: true
      - name: description
        label: 搜尋摘要
        type: text
        required: true
      - name: category
        label: 文章分類
        type: select
        options:
          values:
            - name: deep-sky
              label: 深空觀測
            - name: research
              label: 天文研究
            - name: equipment
              label: 器材教學
            - name: basics
              label: 天文知識
      - name: date
        label: 發布日期
        type: date
      - name: draft
        label: 草稿（開啟時不公開）
        type: boolean
        default: true
      - name: cover
        label: 封面圖片
        type: image
      - name: body
        label: 文章正文
        type: rich-text

  - name: gallery
    label: 天文攝影作品
    type: collection
    path: src/content/gallery
    format: yaml-frontmatter
    filename:
      template: "{fields.id}.md"
      field: false
    view:
      primary: title
      fields: [object_name, observed_at, draft]
      sort: observed_at
      order: desc
    fields:
      - name: id
        label: 作品唯一識別碼（自動）
        type: uuid
        hidden: true
        options:
          editable: false
      - name: title
        label: 作品標題
        type: string
        required: true
      - name: object_name
        label: 天體名稱或編號
        type: string
        required: true
      - name: description
        label: 作品簡介與 SEO 摘要
        type: text
        required: true
      - name: photo
        label: 主要天文照片
        type: image
        required: true
      - name: observed_at
        label: 觀測日期
        type: date
      - name: equipment
        label: 觀測設備（例如 Seestar S30 Pro）
        type: string
      - name: exposure
        label: 曝光資訊（例如 10 秒 × 120 張）
        type: string
      - name: location
        label: 觀測地點（可不填）
        type: string
      - name: credits
        label: 影像來源與版權說明
        type: string
      - name: draft
        label: 草稿（開啟時不公開）
        type: boolean
        default: true
      - name: body
        label: 觀測心得與科學說明
        type: rich-text

settings:
  content:
    merge: true
