
media:
  input: media
  output: /cosmic-atelier/media

content:
  # ============================
  # 1. 首頁文字設定
  # ============================
  - name: site
    label: 首頁文字設定
    type: file
    path: data/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: eyebrow
        label: 首頁小標題
        type: string

      - name: intro
        label: 首頁介紹
        type: text

      - name: library_intro
        label: 天文文獻區說明
        type: text

      - name: about_intro
        label: 關於本站說明
        type: text

  # ============================
  # 2. 天文期刊與來源
  # ============================
  - name: sources
    label: 天文期刊與來源
    type: file
    path: data/sources.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: title
        label: 來源名稱
        type: string
        required: true

      - name: type
        label: 類別
        type: select
        options:
          values:
            - name: journal
              label: 學術期刊
            - name: preprint
              label: 預印本
            - name: news
              label: 天文通訊

      - name: label
        label: 英文標籤
        type: string

      - name: desc
        label: 來源介紹
        type: text

      - name: url
        label: 來源網址（https://）
        type: string

  # ============================
  # 3. 天文文章管理
  # ============================
  - name: articles
    label: 天文文章管理
    type: collection
    path: src/content/articles
    format: yaml-frontmatter

    # 自動產生 UUID 檔名
    filename:
      template: "{fields.id}.md"
      field: false

    view:
      primary: title
      fields: [title, category, date, draft]
      sort: [date, title]
      default:
        sort: date
        order: desc

    fields:
      # 自動產生文章識別碼
      - name: id
        label: 文章識別碼
        type: uuid
        hidden: true
        options:
          editable: false

      - name: title
        label: 文章標題
        type: string
        required: true

      - name: description
        label: 搜尋摘要（建議 70 至 150 字）
        type: text
        required: true

      - name: category
        label: 文章分類
        type: select
        options:
          values:
            - name: deep-sky
              label: 深空觀測
            - name: research
              label: 天文研究
            - name: equipment
              label: 器材教學
            - name: basics
              label: 天文知識

      - name: date
        label: 發布日期
        type: date

      - name: draft
        label: 草稿（開啟時不公開）
        type: boolean
        default: true

      - name: cover
        label: 封面圖片（可不填）
        type: image

      - name: body
        label: 文章正文
        type: rich-text

settings:
  content:
    merge: true
